# TEMPLATE (itération ultérieure) : infrarouge, distance d1.
# Décalage spectral de haut rang -> envisager adapter: full_finetune (cf. B1).
defaults: base
modality: ir
distance: d1
generator:
  adapter: lora          # TODO(claude): comparer lora vs full_finetune pour l'IR
  sample:
    lora_scale: 0.42
    auto_calibrate_lora_scale: false
    # Filtre desactive pour l'IR : compare cosinus ArcFace (entraine sur RGB) entre
    # images generees RGB et references reelles IR (niveaux de gris -> canal triplique).
    # Comparaison cross-modale -> cosinus systematiquement < 0.45, tout est rejete.
    # Le filtrage d'identite reste fait a posteriori par stage fidelity/filter_synthetic.
    filter_during_generation: false
# Post-traitement IR (stage ir_postprocess, après generate, avant fidelity).
# Normalise les images RGB générées (incohérentes : certaines grises, d'autres
# fade-couleur) vers le look des caméras IR SCface cam_6/cam_7 à d1 (4.20m).
# sigma_blur et noise_std calibrés empiriquement -- à ajuster après inspection
# visuelle des images traitées vs vraies images IR SCface d1.
ir_postprocess:
  sigma_blur: 1.5   # rayon flou gaussien en pixels (espace 512x512 généré)
  noise_std: 0.02   # écart-type bruit capteur IR (espace [0,1])

eval:
  terrains: [["ir","d1"]]
